name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: policy / traceability and public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Explain policy validation
        run: |
          {
            echo "## Policy gate"
            echo "Validates PR traceability and rejects non-public artifacts or identifiers."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate PR traceability
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/check_pr_title.py "$PR_TITLE" "$PR_BRANCH"
      - name: Public release scan
        run: python3 scripts/check_public_release.py
  lean:
    name: lean / pinned build and proof audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Explain Lean validation
        run: |
          {
            echo "## Lean gate"
            echo "Builds with the pinned toolchain, then rejects proof placeholders and unexpected theorem axioms."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
      - name: Audit theorem axioms
        run: python3 scripts/audit_proofs.py
      - name: Public release scan
        run: python3 scripts/check_public_release.py
  required:
    name: ci / required
    if: ${{ always() }}
    needs: [policy, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain required-check result
        run: |
          {
            echo "## Required gate"
            echo "Passes only when the policy and pinned Lean proof-audit gates succeed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful gates
        env:
          POLICY: ${{ needs.policy.result }}
          LEAN: ${{ needs.lean.result }}
        run: test "$POLICY" = success && test "$LEAN" = success
